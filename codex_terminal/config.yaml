name: "Codex Terminal"
version: "0.5.11"
slug: "codex_terminal"
description: "Persistent OpenAI Codex chat interface for Home Assistant"
url: "https://github.com/Jhamende/ha-codex-terminal"
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: true
ingress: true
ingress_port: 8099
ingress_stream: true
panel_icon: "mdi:message-text-code"
panel_title: "Codex"
panel_admin: true
watchdog: "http://[HOST]:[PORT:8099]/"
map:
  - type: homeassistant_config
    read_only: false
    path: /config
  - type: share
    read_only: false
    path: /share
options:
  working_directory: "/config"
  permission_mode: "default"
schema:
  working_directory: str
  permission_mode: "list(default|full-auto|full-access)"
