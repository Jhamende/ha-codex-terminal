name: "Codex Terminal"
version: "0.4.7"
slug: "codex_terminal"
description: "OpenAI Codex CLI in a classic Home Assistant terminal"
url: "https://github.com/Jhamende/ha-codex-terminal"
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: true
ingress: true
ingress_port: 8099
ingress_stream: true
panel_icon: "mdi:console"
panel_title: "Codex"
panel_admin: true
watchdog: "http://[HOST]:[PORT:8099]/"
map:
  - type: homeassistant_config
    read_only: false
    path: /config
  - type: share
    read_only: false
    path: /share
options:
  working_directory: "/config"
  terminal_font_size: 13
  auto_resume_last_session: false
  permission_mode: "default"
schema:
  working_directory: str
  terminal_font_size: "int(10,30)"
  auto_resume_last_session: bool
  permission_mode: "list(default|full-auto|full-access)"